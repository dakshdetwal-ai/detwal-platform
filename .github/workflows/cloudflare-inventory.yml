name: Cloudflare Resource Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cloudflare resources (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing"
            exit 1
          fi

          request() {
            curl --silent --show-error \
              --output /tmp/cf-response.json \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" "$1"
          }

          status=$(request "https://api.cloudflare.com/client/v4/accounts")
          if [ "$status" != "200" ]; then
            echo "::error::Could not list Cloudflare accounts (HTTP $status)"
            jq -r '.errors[]?.message // "Unknown API error"' /tmp/cf-response.json
            exit 1
          fi
          accounts_json=$(cat /tmp/cf-response.json)
          echo "$accounts_json" | jq -e '.success == true' >/dev/null
          echo "Accessible account count: $(echo "$accounts_json" | jq '.result | length')"

          while IFS= read -r account; do
            account_id=$(echo "$account" | jq -r '.id')
            account_name=$(echo "$account" | jq -r '.name')
            echo ""
            echo "===== ACCOUNT: $account_name ($account_id) ====="

            for item in "Workers:workers/scripts" "D1:d1/database" "KV:storage/kv/namespaces" "R2:r2/buckets"; do
              label="${item%%:*}"
              endpoint="${item#*:}"
              echo ""
              echo "--- $label ---"
              status=$(request "https://api.cloudflare.com/client/v4/accounts/$account_id/$endpoint")
              response=$(cat /tmp/cf-response.json)

              if [ "$status" = "200" ] && echo "$response" | jq -e '.success == true' >/dev/null; then
                # R2 returns its collection under result.buckets; other APIs return result directly.
                count=$(echo "$response" | jq '(.result.buckets // .result // []) | if type == "array" then length else 0 end')
                echo "$response" | jq -r '
                  (.result.buckets // .result // []) |
                  if type == "array" then .[] else empty end |
                  if type == "object" then
                    "name=" + (.name // .title // "unnamed") +
                    " id=" + (.id // .uuid // "n/a")
                  else
                    "Unexpected resource entry type: " + type
                  end'
                echo "$label count: $count"
              else
                echo "HTTP $status"
                echo "$response" | jq -r '
                  if (.errors | type) == "array" and (.errors | length) > 0
                  then .errors[] | "Cloudflare error code: " + ((.code // "unknown") | tostring) + " — " + (.message // "Unknown API error")
                  else (.messages[]?.message // "Cloudflare API returned an unexpected response")
                  end'
              fi
            done
          done < <(echo "$accounts_json" | jq -c '.result[]')

          echo ""
          echo "Inventory finished. This workflow does not create, edit, or delete resources."
