name: Cloudflare Manager (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check token and list account resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"
            exit 1
          fi

          response=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")

          echo "$response" | jq -e '.success == true' >/dev/null
          echo "Cloudflare accounts accessible to this token:"
          echo "$response" | jq -r '.result[] | "- " + .name + " (ID: " + .id + ")"'
