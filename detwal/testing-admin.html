<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopG Testing Applications — DETwal</title><link rel="stylesheet" href="css/testing-admin.css"></head>
<body><main class="shell"><a class="brand" href="index.html">DET<span>wal</span></a>
<section class="panel" id="loginPanel"><p class="eyebrow">PRIVATE ADMIN AREA</p><h1>Testing applications</h1><p class="muted">Sign in to review TopG Algo free-testing applicants.</p>
<form id="gateForm"><label for="adminId">Admin ID</label><input id="adminId" autocomplete="username" required placeholder="Enter admin ID"><label for="adminPass">Password</label><input id="adminPass" type="password" autocomplete="current-password" required placeholder="Enter password"><p id="message" role="status"></p><button type="submit" id="loginBtn">View applications</button></form>
<p class="hint">This page also requires your DETwal admin account to be signed in.</p></section>
<section id="resultsPanel" hidden><div class="top"><div><p class="eyebrow">TOPG ALGO</p><h1>Free testing applicants</h1><p class="muted" id="count">Loading…</p></div><button class="secondary" id="refreshBtn">Refresh</button></div><div id="applications" class="applications"></div><button class="secondary signout" id="signoutBtn">Sign out</button></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script src="js/testing-admin.js" defer></script></body></html>
