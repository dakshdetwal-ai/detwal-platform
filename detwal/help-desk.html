<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Help Desk — DETwal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/account.css"><link rel="stylesheet" href="css/help-desk.css"></head>
<body><header class="site-header"><div class="container nav-container"><a href="index.html" class="logo"><span class="logo-text">DET<span class="accent">wal</span></span></a><nav class="nav-actions"><a class="btn btn-ghost" href="dashboard.html">Dashboard</a></nav></div></header>
<main class="help-wrap"><section class="help-card"><span class="hero-badge">DETwal Support</span><h1>How can we <span class="gradient-text">help you?</span></h1><p>Submit a support ticket. Our team will reply through your DETwal account.</p>
<form id="helpForm" class="help-form"><label for="helpName">Your name</label><input id="helpName" name="name" maxlength="80" autocomplete="name" required placeholder="Enter your name">
<label for="helpEmail">Email address</label><input id="helpEmail" name="email" type="email" autocomplete="email" required placeholder="Enter your email">
<label for="helpSubject">Subject</label><select id="helpSubject" name="subject" required><option value="">Choose a subject</option><option>Account and login</option><option>Payment and billing</option><option>TopG Algo plan</option><option>Installation and setup</option><option>Technical issue</option><option>Other</option></select>
<label for="helpMessage">Your query</label><textarea id="helpMessage" name="message" rows="6" maxlength="2000" required placeholder="Describe your question or issue..."></textarea>
<p class="help-note">Your query will be submitted as a support ticket. Keep your account email accessible for replies.</p>
<button class="btn btn-primary btn-lg" type="submit">Submit support ticket</button></form></section></main>
<footer class="site-footer"><div class="container footer-bottom-inner"><p>© <span id="year">2026</span> DETwal. All rights reserved.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script src="js/account-ui.js" defer></script><script src="js/help-desk.js" defer></script></body></html>
